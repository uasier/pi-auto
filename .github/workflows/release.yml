name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "上传安装包到已有 GitHub Release tag（如 v0.1.0）。留空则只构建产物。"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check version files match tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            node scripts/sync-version.mjs --check --tag "${GITHUB_REF_NAME}"
          else
            node scripts/sync-version.mjs --check
          fi

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS-arm64
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            name: macOS-x64
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust_targets: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - name: Install frontend deps
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Test rust
        run: npm run test:rust

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag || '' }}
          releaseName: herdr+ v__VERSION__
          releaseBody: |
            herdr+ 跑在 Herdr 上面：接管 pane，空闲后发送下一轮。

            ## 安装包
            - macOS Apple Silicon：`pi-auto_*_aarch64.dmg`
            - macOS Intel：`pi-auto_*_x64.dmg`
            - Android：`herdr-plus-remote.apk`

            安装包未签名。若提示「已损坏，无法打开」，把 App 放进「应用程序」后执行：

            ```bash
            xattr -dr com.apple.quarantine "/Applications/herdr+.app"
            ```

            应用内点版本号可检查更新并下载当前系统对应安装包。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          releaseAssetNamePattern: pi-auto_[version]_[arch][ext]
          retryAttempts: 2

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-auto-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
          if-no-files-found: warn

  android:
    needs: verify
    runs-on: ubuntu-latest
    name: Build Android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # cmdline-tools 16 no longer ships the obsolete "tools" package.
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble release APK
        working-directory: remote-android
        run: gradle :app:assembleRelease

      - name: Name release asset
        run: cp remote-android/app/build/outputs/apk/release/app-release.apk herdr-plus-remote.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: herdr-plus-remote
          path: herdr-plus-remote.apk

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" herdr-plus-remote.apk --clobber --repo "${GITHUB_REPOSITORY}"
